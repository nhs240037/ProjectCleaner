name-template: 'v$NEXT_PATCH_VERSION'
tag-template: '$NEXT_PATCH_VERSION'
categories:
  - title: '🚀 新機能・機能追加 / New Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 バグ修正 / Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🧰 依存関係・ビルド調整 / Maintenance'
    labels:
      - 'dependencies'
      - 'chore'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## 変更内容 / What's Changed
  $CHANGES