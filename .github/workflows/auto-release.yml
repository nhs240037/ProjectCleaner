name: Auto Release on PR Merge with Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  auto-tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Tag and Push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          LABELS=$(gh pr view $PR_NUMBER --json labels --jq '.labels[].name' | tr '\n' ' ')
          echo "Detected Labels: $LABELS"

          if [[ ! "$LABELS" =~ "release:" ]]; then
            echo "No release: label found. Skipping tag creation."
            exit 0
          fi

          ALL_TAGS=$(git tag -l)
          if [ -z "$ALL_TAGS" ]; then
            BASE_VERSION="1.0.0"
          else
            BASE_VERSION=$(echo "$ALL_TAGS" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+).*/\1/' | sort -V | tail -n 1)
          fi

          echo "Base Version detected: $BASE_VERSION"
          IFS='.' read -r major minor patch <<< "$BASE_VERSION"

          if [[ "$LABELS" =~ "release:major" ]]; then
            TARGET_VERSION="$((major + 1)).0.0"
          elif [[ "$LABELS" =~ "release:minor" ]]; then
            TARGET_VERSION="${major}.$((minor + 1)).0"
          elif [[ "$LABELS" =~ "release:patch" ]]; then
            TARGET_VERSION="${major}.${minor}.$((patch + 1))"
          else
            TARGET_VERSION="$BASE_VERSION"
          fi

          SUFFIX_TYPE=""
          if [[ "$LABELS" =~ "dev" ]]; then
            SUFFIX_TYPE="--dev"
          elif [[ "$LABELS" =~ "alpha" ]]; then
            SUFFIX_TYPE="-alpha"
          elif [[ "$LABELS" =~ "beta" ]]; then
            SUFFIX_TYPE="-beta"
          fi

          NEW_TAG=""

          if [ -n "$SUFFIX_TYPE" ]; then
            LATEST=$(git tag -l "${TARGET_VERSION}${SUFFIX_TYPE}.*" | sort -V | tail -n 1)
            if [[ "$LATEST" =~ \.([0-9]+)$ ]]; then
              NEXT_NUM=$((${BASH_REMATCH[1]} + 1))
            else
              NEXT_NUM=1
            fi
            NEW_TAG="${TARGET_VERSION}${SUFFIX_TYPE}.${NEXT_NUM}"
          else
            NEW_TAG="$TARGET_VERSION"
          fi

          if [ -n "$NEW_TAG" ]; then
            echo "Creating new tag: $NEW_TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"

            gh workflow run release.yml -f tag_name="$NEW_TAG"
          fi