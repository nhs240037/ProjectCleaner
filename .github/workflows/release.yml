name: Build and Release

on:
  push:
    tags:
      - '*.*.*' 
      - '*.*.*-*' 

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish App
        run: |
          dotnet publish ProjectCleaner.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false /p:Version=${{ github.ref_name }} -o ./publish_raw

      - name: Organize Files
        shell: pwsh
        run: |
          if (Test-Path ./publish) { Remove-Item -Recurse -Force ./publish }
          New-Item -ItemType Directory -Path ./publish/bin -Force

          Move-Item ./publish_raw/* ./publish/bin/

          $setupBatContent = @'
          @echo off
            setlocal
            cd /d "%~dp0"
            powershell -ExecutionPolicy Bypass -NoProfile -Command "& {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing

              $form = New-Object System.Windows.Forms.Form
              $form.Text = 'ProjectCleaner セットアップ'
              $form.Size = New-Object System.Drawing.Size(360, 210)$form.StartPosition = 'CenterScreen'
              $form.FormBorderStyle = 'FixedDialog'$form.MaximizeBox = $false$form.Icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Join-Path (Get-Location) 'bin\ProjectCleaner.exe'))

              $label = New-Object System.Windows.Forms.Label
              $label.Text = 'アップデートチャンネルを選択してください:'
              $label.Location = New-Object System.Drawing.Point(20, 20)
              $label.AutoSize =$true
              $form.Controls.Add($label)

              $combo = New-Object System.Windows.Forms.ComboBox
              $combo.Location = New-Object System.Drawing.Point(20, 45)
              $combo.Size = New-Object System.Drawing.Size(300, 30)$combo.DropDownStyle = [System.Windows.Forms.ComboBoxStyle]::DropDownList
              [void]$combo.Items.Add('stable')
              [void]$combo.Items.Add('beta')
              [void]$combo.Items.Add('alpha')
              [void]$combo.Items.Add('dev')
              
              $combo.SelectedItem = 'stable'
              $form.Controls.Add($combo)

              $btn = New-Object System.Windows.Forms.Button
              $btn.Text = 'ショートカットを作成する'
              $btn.Location = New-Object System.Drawing.Point(20, 90)$btn.Size = New-Object System.Drawing.Size(300, 45)
              $btn.Add_Click({$channel = $combo.SelectedItem.ToString()$rootDir = Get-Location
                $targetExe = Join-Path$rootDir 'bin\ProjectCleaner.exe'

                if (-not (Test-Path $targetExe)) {
                  [System.Windows.Forms.MessageBox]::Show('bin\ProjectCleaner.exe が見つかりません。', 'エラー', [System.Windows.Forms.MessageBoxButtons]::OK, [System.Windows.Forms.MessageBoxIcon]::Error)
                  return
                }

                Set-Content -Path (Join-Path $rootDir 'bin\channel.txt') -Value$channel -Encoding UTF8

                $wsh = New-Object -ComObject WScript.Shell
                $shortcutPath = Join-Path $rootDir 'ProjectCleaner.lnk'$shortcut = $wsh.CreateShortcut($shortcutPath)
                $shortcut.TargetPath =$targetExe
                $shortcut.WorkingDirectory = Join-Path$rootDir 'bin'
                $shortcut.Arguments = "--channel $channel"
                $shortcut.Description = "ProjectCleaner ($channel チャンネル)"
                $shortcut.Save()

                [System.Windows.Forms.MessageBox]::Show("ショートカットを作成しました！`n`n選択チャンネル: $channel", '完了', [System.Windows.Forms.MessageBoxButtons]::OK, [System.Windows.Forms.MessageBoxIcon]::Information)
                $form.Close()
              })
              $form.Controls.Add($btn)

              [void]$form.ShowDialog()
            }"
            '@
          Set-Content -Path ./publish/Setup.bat -Value $setupBatContent -Encoding UTF8

      - name: Create Zip Archives
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ProjectCleaner-win-x64.zip

          Compress-Archive -Path ./publish/bin/ProjectCleaner.dll, ./publish/bin/ProjectCleaner.deps.json -DestinationPath ProjectCleaner-Update.zip

      - name: Get Previous Tag
        id: prev_tag
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          git fetch --tags --force
          if ($currentTag -match "-(dev|test|canary|beta|alpha)") {
              $suffix = $Matches[1]
              Write-Host "Detected Prerelease Suffix: $suffix"
              $prev = (git tag -l "*-$suffix*" --sort=-v:refname | Where-Object { $_ -ne $currentTag } | Select-Object -First 1)
          } else {
              $prev = (git tag -l "*.*.*" --sort=-v:refname | Where-Object { $_ -ne $currentTag -and $_ -notmatch "-" } | Select-Object -First 1)
          }
          if (-not $prev) {
              Write-Host "No previous matching tag found."
              $prev = ""
          } else {
              Write-Host "Previous Tag: $prev"
          }
          "PREVIOUS_TAG=$prev" >> $env:GITHUB_ENV
          "previous_tag=$prev" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: | 
            ProjectCleaner-win-x64.zip
            ProjectCleaner-Update.zip
          prerelease: ${{ contains(github.ref_name, '-') }} 
          discussion_category_name: Announcements 
          generate_release_notes: true
          previous_tag: ${{ steps.prev_tag.outputs.previous_tag }} 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}