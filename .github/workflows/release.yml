name: Build and Release

on:
  push:
    tags:
      - '*.*.*' 
      - '*.*.*-*' 

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish App
        run: |
          dotnet publish ProjectCleaner.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false /p:Version=${{ github.ref_name }} -o ./publish_raw

      - name: Organize Files
        shell: pwsh
        run: |
          if (Test-Path ./publish) { Remove-Item -Recurse -Force ./publish }
          New-Item -ItemType Directory -Path ./publish/bin -Force

          Move-Item ./publish_raw/* ./publish/bin/

          $batLines = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'powershell -ExecutionPolicy Bypass -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms; Add-Type -AssemblyName System.Drawing; $f=New-Object System.Windows.Forms.Form; $f.Text=''ProjectCleaner セットアップ''; $f.Size=New-Object System.Drawing.Size(360,210);$f.StartPosition=''CenterScreen''; $f.FormBorderStyle=''FixedDialog'';$f.MaximizeBox=$false; $l=New-Object System.Windows.Forms.Label; $l.Text=''アップデートチャンネルを選択してください:''; $l.Location=New-Object System.Drawing.Point(20,20);$l.AutoSize=$true; $f.Controls.Add($l);$c=New-Object System.Windows.Forms.ComboBox; $c.Location=New-Object System.Drawing.Point(20,45); $c.Size=New-Object System.Drawing.Size(300,30);$c.DropDownStyle=[System.Windows.Forms.ComboBoxStyle]::DropDownList; [void]$c.Items.Add(''stable''); [void]$c.Items.Add(''beta''); [void]$c.Items.Add(''alpha''); [void]$c.Items.Add(''dev''); $c.SelectedItem=''stable'';$f.Controls.Add($c);$b=New-Object System.Windows.Forms.Button; $b.Text=''ショートカットを作成する''; $b.Location=New-Object System.Drawing.Point(20,90); $b.Size=New-Object System.Drawing.Size(300,45);$b.Add_Click({ $ch=$c.SelectedItem.ToString(); $r=Get-Location; $t=Join-Path $r ''bin\ProjectCleaner.exe''; if(-not(Test-Path$t)){[System.Windows.Forms.MessageBox]::Show(''bin\ProjectCleaner.exe が見つかりません。'',''エラー'',0,16);return}; Set-Content -Path (Join-Path $r ''bin\channel.txt'') -Value$ch -Encoding UTF8; $w=New-Object -ComObject WScript.Shell; $s=$w.CreateShortcut((Join-Path $r ''ProjectCleaner.lnk''));$s.TargetPath=$t; $s.WorkingDirectory=(Join-Path $r ''bin'');$s.Arguments=\"--version-channel=$ch\"; $s.Description=\"ProjectCleaner ($ch)\"; $s.Save(); [System.Windows.Forms.MessageBox]::Show(\"ショートカットを作成しました！`n`n選択チャンネル: $ch\",''完了'',0,64); $f.Close() });$f.Controls.Add($b); [void]$f.ShowDialog()"'
          )
          
          $batLines | Out-File -FilePath ./publish/Setup.bat -Encoding utf8BOM

      - name: Create Zip Archives
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ProjectCleaner-win-x64.zip

          Compress-Archive -Path ./publish/bin/ProjectCleaner.dll, ./publish/bin/ProjectCleaner.deps.json -DestinationPath ProjectCleaner-Update.zip

      - name: Get Previous Tag
        id: prev_tag
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          git fetch --tags --force
          if ($currentTag -match "-(dev|test|canary|beta|alpha)") {
              $suffix = $Matches[1]
              Write-Host "Detected Prerelease Suffix: $suffix"
              $prev = (git tag -l "*-$suffix*" --sort=-v:refname | Where-Object { $_ -ne $currentTag } | Select-Object -First 1)
          } else {
              $prev = (git tag -l "*.*.*" --sort=-v:refname | Where-Object { $_ -ne $currentTag -and $_ -notmatch "-" } | Select-Object -First 1)
          }
          if (-not $prev) {
              Write-Host "No previous matching tag found."
              $prev = ""
          } else {
              Write-Host "Previous Tag: $prev"
          }
          "PREVIOUS_TAG=$prev" >> $env:GITHUB_ENV
          "previous_tag=$prev" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: | 
            ProjectCleaner-win-x64.zip
            ProjectCleaner-Update.zip
          prerelease: ${{ contains(github.ref_name, '-') }} 
          discussion_category_name: Announcements 
          generate_release_notes: true
          previous_tag: ${{ steps.prev_tag.outputs.previous_tag }} 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}