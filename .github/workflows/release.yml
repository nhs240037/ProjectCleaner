name: Build and Release

on:
  push:
    tags:
      - '*.*.*'        # 0.0.0 や 1.2.3
      - '*.*.*-*'      # 0.1.0-beta や 1.0.0-alpha.1 などハイフン付きタグも対象にする

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # GitHub Release を作成するために必要
      discussions: write # GitHub Release を作成するために必要

    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. .NET SDK のセットアップ
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x' # 必要に応じてプロジェクトのバージョンに合わせて変更

      # 3. リリース用ビルド（Publish）
      - name: Publish App
        run: |
          dotnet publish ProjectCleaner.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish

      - name: Organize Files
        run: |
          mkdir ./publish
          # 本体の exe やアプリ固有 DLL のみルートに配置
          Move-Item ./publish_raw/ProjectCleaner.exe ./publish/
          Move-Item ./publish_raw/ProjectCleaner.dll ./publish/
          Move-Item ./publish_raw/ProjectCleaner.deps.json ./publish/
          Move-Item ./publish_raw/ProjectCleaner.runtimeconfig.json ./publish/
          
          # ランタイムやその他の大量のDLLを lib フォルダにまとめる
          mkdir ./publish/lib
          Get-ChildItem ./publish_raw/* | Move-Item -Destination ./publish/lib/

      # 4. 生成されたファイルを zip に圧縮
      - name: Create Zip Archives
        run: |
          # 1. フルセット (初回用)
          Compress-Archive -Path ./publish/* -DestinationPath ProjectCleaner-win-x64.zip

          # 2. アプリ本体のみ (自動更新用: ProjectCleaner.dll, ProjectCleaner.exe など)
          # ランタイムDLLを含まないため数MB程度に収まります
          Compress-Archive -Path ./publish/ProjectCleaner.dll, ./publish/ProjectCleaner.exe, ./publish/ProjectCleaner.deps.json -DestinationPath ProjectCleaner-Update.zip


      # 5. GitHub Release を作成（-beta や -alpha は自動的に Pre-release になる）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: | 
            ProjectCleaner-win-x64.zip
            ProjectCleaner-Update.zip
          prerelease: auto # タグにハイフンや文字列（-alpha, -betaなど）が含まれる場合に自動でPre-releaseフラグをONにする
          discussion-category: Announcements  # GitHub Discussions のカテゴリを指定（必要に応じて変更）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}