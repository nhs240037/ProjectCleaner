name: Build and Release

on:
  push:
    tags:
      - '*.*.*' 
      - '*.*.*-*' 

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish App
        run: |
          dotnet publish ProjectCleaner.csproj \
          -c Release \
          -r win-x64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          /p:IncludeNativeLibrariesForSelfExtract=true \
          /p:EnableCompressionInSingleFile=true \
          /p:Version=${{ github.ref_name }} \
          -o ./publish_raw

      - name: Organize Files
        shell: pwsh
        run: |
          if (Test-Path ./publish) { Remove-Item -Recurse -Force ./publish }
          New-Item -ItemType Directory -Path ./publish
          New-Item -ItemType Directory -Path ./publish/lib

          # メインの実行ファイルをルートへ移動
          Move-Item ./publish_raw/ProjectCleaner.exe ./publish/ -ErrorAction SilentlyContinue
          
          # PublishSingleFile でも生成される差分更新用・デバッグ用ファイルをルートへ（存在する場合）
          Move-Item ./publish_raw/ProjectCleaner.dll ./publish/ -ErrorAction SilentlyContinue
          Move-Item ./publish_raw/ProjectCleaner.deps.json ./publish/ -ErrorAction SilentlyContinue
          Move-Item ./publish_raw/ProjectCleaner.runtimeconfig.json ./publish/ -ErrorAction SilentlyContinue
          Move-Item ./publish_raw/ProjectCleaner.pdb ./publish/ -ErrorAction SilentlyContinue

          # 残りの依存ファイル（ネイティブDLL等）を lib フォルダーへ退避
          Get-ChildItem -Path ./publish_raw/* | Move-Item -Destination ./publish/lib/ -ErrorAction SilentlyContinue

      - name: Create Zip Archives
        shell: pwsh
        run: |
          # フルパッケージ (.NETランタイム同梱・ルートに.exe)
          Compress-Archive -Path ./publish/* -DestinationPath ProjectCleaner-win-x64.zip

          # 差分更新用パッケージ (dll / deps.json のみ)
          Compress-Archive -Path ./publish/ProjectCleaner.dll, ./publish/ProjectCleaner.deps.json -DestinationPath ProjectCleaner-Update.zip -ErrorAction SilentlyContinue

      - name: Get Previous Tag
        id: prev_tag
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          git fetch --tags --force
          if ($currentTag -match "-(dev|test|canary|beta|alpha)") {
              $suffix = $Matches[1]
              Write-Host "Detected Prerelease Suffix: $suffix"
              $prev = (git tag -l "*-$suffix*" --sort=-v:refname | Where-Object { $_ -ne $currentTag } | Select-Object -First 1)
          } else {
              $prev = (git tag -l "*.*.*" --sort=-v:refname | Where-Object { $_ -ne $currentTag -and $_ -notmatch "-" } | Select-Object -First 1)
          }
          if (-not $prev) {
              Write-Host "No previous matching tag found."
              $prev = ""
          } else {
              Write-Host "Previous Tag: $prev"
          }
          "PREVIOUS_TAG=$prev" >> $env:GITHUB_ENV
          "previous_tag=$prev" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: | 
            ProjectCleaner-win-x64.zip
            ProjectCleaner-Update.zip
          prerelease: ${{ contains(github.ref_name, '-') }} 
          discussion_category_name: Announcements 
          generate_release_notes: true
          previous_tag: ${{ steps.prev_tag.outputs.previous_tag }} 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}