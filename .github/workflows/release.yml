name: Build and Release

on:
  push:
    tags:
      - '*.*.*' 
      - '*.*.*-*' 
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build release for'
        required: true

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      
      - name: Set Release Version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ inputs.tag_name }}"
          if (-not $ver) {
            $ver = "${{ github.ref_name }}"
          }
          Write-Host "Target Release Version: $ver"
          "VERSION=$ver" >> $env:GITHUB_ENV
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore Dependencies
        run: dotnet restore ProjectCleaner.csproj -r win-x64

      - name: Publish App
        run: |
          dotnet publish ProjectCleaner.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false /p:Version=${{ steps.version.outputs.version }} -o ./publish_raw

      - name: Organize Files
        shell: pwsh
        run: |
          if (Test-Path ./publish) { Remove-Item -Recurse -Force ./publish }
          New-Item -ItemType Directory -Path ./publish/bin -Force

          Move-Item ./publish_raw/* ./publish/bin/

          Copy-Item ./Setup.hta ./publish/Setup.hta

      - name: Create Zip Archives
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ProjectCleaner-win-x64.zip

          Compress-Archive -Path ./publish/bin/ProjectCleaner.dll, ./publish/bin/ProjectCleaner.deps.json -DestinationPath ProjectCleaner-Update.zip

      - name: Get Previous Tag
        id: prev_tag
        shell: pwsh
        run: |
          $currentTag = "${{ steps.version.outputs.version }}"
          git fetch --tags --force
          if ($currentTag -match "-(dev|test|canary|beta|alpha)") {
              $suffix = $Matches[1]
              Write-Host "Detected Prerelease Suffix: $suffix"
              $prev = (git tag -l "*-$suffix*" --sort=-v:refname | Where-Object { $_ -ne $currentTag } | Select-Object -First 1)
          } else {
              $prev = (git tag -l "*.*.*" --sort=-v:refname | Where-Object { $_ -ne $currentTag -and $_ -notmatch "-" } | Select-Object -First 1)
          }
          if (-not $prev) {
              Write-Host "No previous matching tag found."
              $prev = ""
          } else {
              Write-Host "Previous Tag: $prev"
          }
          "PREVIOUS_TAG=$prev" >> $env:GITHUB_ENV
          "previous_tag=$prev" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: | 
            ProjectCleaner-win-x64.zip
            ProjectCleaner-Update.zip
          prerelease: ${{ contains(steps.version.outputs.version, '-') }} 
          discussion_category_name: Announcements 
          generate_release_notes: true
          previous_tag: ${{ steps.prev_tag.outputs.previous_tag }} 
          tag_name: ${{steps.version.outputs.version}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}