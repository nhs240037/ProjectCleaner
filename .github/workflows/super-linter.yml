name: Super-Linter

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 
          persist-credentials: false

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@latest
        env:
          VALIDATE_ALL_CODEBASE: false 
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          VALIDATE_CSHARP: true
          VALIDATE_YAML: true
